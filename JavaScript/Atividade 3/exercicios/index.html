<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Exercícios A–F</title><link rel="stylesheet" href="../style.css"></head><body><main class="panel"><a class="back" href="../index.html">← Voltar ao menu</a><h1>Exercícios de fixação A–F</h1><h2>A. Par ou ímpar</h2><label for="numero">Número inteiro</label><input id="numero" type="number"><button id="btnPar">Verificar</button><p id="rPar" class="result"></p><h2>B. Desconto</h2><label for="compra">Valor da compra (R$)</label><input id="compra" type="number" min="0" step="0.01"><button id="btnDesconto">Calcular</button><p id="rDesconto" class="result"></p><h2>C. Controle de acesso</h2><label for="idadeC">Idade</label><input id="idadeC" type="number"><label><input id="cadastro" type="checkbox" style="width:auto"> Cadastro ativo</label><button id="btnAcesso">Verificar acesso</button><p id="rAcesso" class="result"></p><h2>D. Saudação</h2><label for="nome">Nome</label><input id="nome" type="text"><button id="btnSaudar">Saudar</button><p id="rSaudar" class="result"></p><h2>E. Temperatura</h2><label for="temperatura">Temperatura (°C)</label><input id="temperatura" type="number"><button id="btnTemp">Classificar</button><p id="rTemp" class="result"></p><h2>F. Validação de nota</h2><label for="nota">Nota (0 a 10)</label><input id="nota" type="number" step="0.1"><button id="btnNota">Validar</button><p id="rNota" class="result"></p></main><script src="script.js"></script></body></html>
