<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Calculadora de média</title><link rel="stylesheet" href="../style.css"></head><body><main class="panel"><a class="back" href="../index.html">← Voltar ao menu</a><h1>Calculadora de média</h1><p>Informe três notas entre 0 e 10.</p><label for="nota1">Nota 1</label><input id="nota1" type="number" min="0" max="10" step="0.1"><label for="nota2">Nota 2</label><input id="nota2" type="number" min="0" max="10" step="0.1"><label for="nota3">Nota 3</label><input id="nota3" type="number" min="0" max="10" step="0.1"><button id="calcular">Calcular média</button><p id="resultado" class="result" aria-live="polite"></p></main><script src="script.js"></script></body></html>
